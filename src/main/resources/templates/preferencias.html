<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8"
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>AlphaSystem - AlphaSystem</title>
        <link rel="stylesheet" th:href="@{/bootstrap.css/bootstrap.min.css}">
        <link th:href="@{/css/}+${css}+'.css'" rel="stylesheet" type="text/css"/>

    <body>
        <div class="page">

                            </div>
                            
                            
                             <div class="field2">
                                <label for="selEstilo">Seu esquema de cores favorito</label> 
                                   <select name="estilo" id="selEstilo" required> 
                                        <option value="claro">Tema Claro</option> 
                                        <option value="escuro">Tema Escuro</option> 
                                    </select>
                            </div> 
                            
                        </div>
                        <div class="actions">
                                    <button class="btnSair" type="submit" value="OK"/> OK </button>
                        </div>
                            
                        
                     </form>       
                </section>
            </main>
        </div>
        <script th:src="@{/bootstrap.js/bootstrap.min.js}"></script>
    </body>
</html>
