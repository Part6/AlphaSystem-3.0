<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Cadastro de Clientes - AlphaSystem</title>
        <link rel="stylesheet" th:href="@{/bootstrap.css/bootstrap.min.css}">
        <link th:href="@{/css/}+${css}+'.css'" rel="stylesheet" type="text/css"/> 
    </head>
    <body>
        <div class="page">
            <header class="header"> <img th:src="@{/image/alpha.png}" height="50px"> CADASTRO DE CLIENTES</header>
            <main class="content">
                <section class="panel">
                    <form id="formCliente"  th:object="${cliente}">
                        <div class="form-grid">

                            <div class="field">
                                <label>Nome:</label>
                                <input id="nome" type="text" th:field="${cliente.nome}" placeholder="...">
                            </div>

                            <div class="field">
                                <label>Rua:</label>
                                <input id="rua" type="text" th:field="${endereco.rua}" placeholder="...">
                            </div>

                            <div class="field">
                                <label>Email:</label>
                                <input id="email" type="email" th:field="${cliente.email}" placeholder="...">
                            </div>
                            
                            <div class="field">
                                <label>Cidade:</label>
                                <input id="cidade" type="text" th:field="${endereco.cidade}" placeholder="...">
                            </div>
                            
                            <div class="field">
                                <label>CPF:</label>
                                <input id="cpf" type="text" th:field="${cliente.cpf}" placeholder="...">
                            </div>
                            
                            <div class="field">
                                <label>Estado:</label>
                                <input id="estado" type="text" th:field="${endereco.estado}" placeholder="...">
                            </div>
                            
                            <div class="field">
                                <label>CEP:</label>
                                <input id="cep" type="text" th:field="${endereco.cep}" placeholder="...">
                            </div>
                            
                            <div class="field">
                                <label>Número da casa:</label>
                                <input id="nCasa" type="text" th:field="${endereco.numero}" placeholder="...">
                            </div>
                        </div>

                        <div class="actions"> 
                            <a class="btnSair"
                                th:href="@{/menu/menuCadastro}">
                                 Sair
                            </a>
                            <button type="button"
                                    class="btn"
                                    onclick="limparFormulario('formCliente')">
                                Limpar
                            </button>
                            <button class="btn" type="submit" >Salvar</button>
                        </div>

                    </form>
                </section>
            </main>
        </div>
        <script th:src="@{/bootstrap.js/bootstrap.min.js}"></script>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script th:src="@{/js/ClienteScript.js}"></script>
        <script src="/js/script.js"></script>
    </body>
</html>
