<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Consulta de Usuários - AlphaSystem</title>
        <link rel="stylesheet" th:href="@{/bootstrap.css/bootstrap.min.css}">
        <link th:href="@{/css/}+${css}+'.css'" rel="stylesheet" type="text/css"/> 
    </head>
    <body>
        <div class="page">
            <header class="header"><img th:src="@{/image/alpha.png}" height="50px"> CONSULTA DE USUÁRIOS</header>
            <main class="content">
                <section class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Id</th>
                                <th>Email</th>
                                <th>Senha</th>
                                <th>Nome</th>
                                <th>Cargo</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaVendas">
                            <tr th:each="usuario : ${usuarios}">
                                
                                <td th:text="${usuario.id}"></td>
                                <td th:text="${usuario.login}"></td>
                                <td th:text="${usuario.senha}"></td>
                                <td th:text="${usuario.nome}"></td>
                                <td th:text="${usuario.tipo}"></td>

                                <td>
                                    
                                    <a th:href="@{/editar/usuario/{id}(id=${usuario.id})}"> <button type="reset" class="btnAcao">  Editar </button> </a>
                                </td>
                                <td>
                                   <button type="button"
                                            class="btnExcluir"
                                            th:data-id="${usuario.id}">
                                        Excluir
                                    </button>
                                </td>

                            </tr>
                            
                        </tbody>
                    </table>
                    <div class="actions" style="justify-content:flex-start">
                        <a class="btnSair" th:href="@{/menu/menuGerente}">  Sair </a>
                    </div>
                </section>
            </main>
        </div>
       <script th:src="@{/bootstrap.js/bootstrap.min.js}"></script>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script th:src="@{/js/UsuarioScriptv2.js}"></script>
    </body>
</html>
