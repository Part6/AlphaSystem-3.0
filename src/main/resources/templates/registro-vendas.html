<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Registro de Vendas - AlphaSystem</title>
        <link rel="stylesheet" th:href="@{/bootstrap.css/bootstrap.min.css}">
        <link th:href="@{/css/}+${css}+'.css'" rel="stylesheet" type="text/css"/> 
    </head>
    <body>
        <div class="page">
            <header class="header">REGISTRO DE VENDAS</header>
            <main class="content">
                <section class="panel">
                    <form id="formVenda">
                        <div class="form-grid">
                            <div class="field">
                                <label>Cliente:</label>
                                <select id="cliente" required> 
                                    <option value="">Selecione um cliente</option>
                                    <option th:each="cliente : ${clientes}"
                                            th:value="${cliente.id}"
                                            th:text="${cliente.nome}">
                                    </option>
                                </select>
                            </div>
                            
                            <div class="field">
                                <label>Data:</label>
                                <input id="data" type="date" th:field="${venda.data}" placeholder="...">
                            </div>
                            
                            <div class="field">
                                <label>Número de itens:</label>
                                <input id="qnt" type="number" th:field="${venda.quantidadeItens}" placeholder="...">
                            </div>
                            
                            <div class="field">
                                <label>Produto:</label>
                                <select id="produto" required>
                                    <option value="">Selecione um produto</option>
                                    <option th:each="produto : ${produtos}"
                                            th:value="${produto.id}"
                                            th:text="${produto.nome}">
                                    </option>
                                </select>
                            </div>
                            
                            <div class="field">
                                <label>Observações:</label>
                                <textarea id="observacoes" th:field="${venda.observacoes}" placeholder="..."></textarea>
                            </div>
                        </div>
                        <div class="actions">
                            <a class="btn outline"
                                th:href="@{/menu/menuCadastro}">
                                 Sair
                            </a>
                            <button type="button"
                                    class="btn"
                                    onclick="limparFormulario('formVenda')">
                                Limpar
                            </button>
                            <button class="btn" type="submit" >Salvar</button>
                        </div>
                    </form>
                </section>
            </main>
        </div>
        <script th:src="@{/bootstrap.js/bootstrap.min.js}"></script>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="/js/script.js"></script>
        <script src="/js/VendaScript.js"></script>
    </body>
</html>
