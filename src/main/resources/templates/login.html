<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Login de Usuário - AlphaSystem</title>
        <link rel="stylesheet" th:href="@{/bootstrap.css/bootstrap.min.css}">
        <link th:href="@{/css/}+${css}+'.css'" rel="stylesheet" type="text/css"/> 
    </head>
    <body>
        <div class="page">
            <header class="header">LOGIN DE USUÁRIO</header>
            <main class="content">
                <section class="login-panel">
                   <form id="formLogin">
                        <div class="login-field">
                            <label for="login">Login:</label>
                            <input id="login" type="text" th:field="${usuario.login}" autocomplete="username" required placeholder="Digite seu login">
                        </div>

                        <div class="login-field">
                            <label for="senha">Senha:</label>
                            <input id="senha" type="password" th:field="${usuario.senha}" autocomplete="current-password" required placeholder="Digite sua senha">
                        </div>

                        <div class="actions">
                            <a class="btn outline" th:href="@{/}">Sair</a>
                            <button class="btn" type="reset">Limpar</button>
                            <button class="btn" type="submit">Entrar</button>
                        </div>
                    </form>
                </section>              
            </main>
        </div>
        <script th:src="@{/bootstrap.js/bootstrap.min.js}"></script>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script th:src="@{/js/loginScript.js}"></script>
        <script src="/js/script.js"></script>
    </body>
</html>
